[project]
name = "ai-interview-production"
version = "0.1.0"
description = "Local production control plane for AI interview videos"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.scripts]
ai-interview = "ai_interview.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator/ai_interview"]

[tool.uv]
package = true
